# CI: lint, test, and build the full pipeline on small synthetic data. Hardened in Phase 7.
name: ci

# Manual-only until Phase 4 passes (the generator and models don't exist yet, so CI would fail).
# Phase 4: switch to the commented triggers below.
on:
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DUCKDB_PATH: warehouse/ci.duckdb
      WAREHOUSE: duckdb
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-groups
          uv run dbt deps --project-dir transform --profiles-dir transform

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run sqlfluff lint transform/models transform/tests transform/snapshots

      - name: Unit tests (Python)
        run: uv run pytest -q

      - name: Generate small synthetic data
        run: uv run python -m generator.generate --scale small --mode backfill

      - name: Load to DuckDB
        run: |
          uv run python -m ingestion.load_erp
          uv run python -m ingestion.load_fred
        # FRED_API_KEY is intentionally not set in CI: load_fred skips and dbt uses seed FX rates.

      - name: dbt build
        run: uv run dbt build --project-dir transform --profiles-dir transform --target ci
