# Build the warehouse from scratch and publish the dashboard (/) and dbt docs (/dbt-docs/)
# to GitHub Pages. Runs on every push to main and nightly; the nightly run simulates every
# day through yesterday, so the live site always shows fresh (synthetic) data.
# One-time repo setting: Settings -> Pages -> Source: "GitHub Actions".
name: deploy-pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC daily, after the simulated 02:00 UTC extraction
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # never interrupt a deploy halfway

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WAREHOUSE: duckdb
      DUCKDB_PATH: warehouse/craftstones.duckdb
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}  # optional; the public CSV is used without it
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Python dependencies and dbt packages
        run: |
          uv sync
          uv run dbt deps --project-dir transform --profiles-dir transform

      - name: Generate medium-scale synthetic data through yesterday
        run: |
          uv run python -m generator.generate --scale medium --mode backfill
          uv run python -m generator.generate --scale medium --mode catch-up --until yesterday

      - name: Load raw data (dlt)
        run: |
          uv run python -m ingestion.load_erp
          uv run python -m ingestion.load_fred

      - name: dbt build
        run: uv run dbt build --project-dir transform --profiles-dir transform

      - name: Source freshness
        # Reported, not blocking: a stale source shouldn't take the site down.
        continue-on-error: true
        run: uv run dbt source freshness --project-dir transform --profiles-dir transform

      - name: dbt docs (single static file)
        run: uv run dbt docs generate --static --project-dir transform --profiles-dir transform

      - name: Build dashboard (Evidence)
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run sources
          npm run build:strict

      - name: Assemble site
        run: |
          mkdir -p site/dbt-docs
          cp -r dashboard/build/. site/
          cp transform/target/static_index.html site/dbt-docs/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
