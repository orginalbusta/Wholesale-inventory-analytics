[project]
name = "wholesale-inventory-analytics"
version = "0.1.0"
description = "Ideal-state redesign of the Craftstones USA data platform: inventory and demand analytics on synthetic + public data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harsh Arya" }]

# Loose lower bounds checked against PyPI on 2026-10-14. Claude Code: resolve and tighten in Phase 0.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "faker>=30",
    "pyyaml>=6",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "duckdb>=1.2",
    "dlt[duckdb]>=1.20",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.10",
    "dagster>=1.11",
    "dagster-webserver>=1.11",
    "dagster-dbt>=0.27",
]

[project.optional-dependencies]
snowflake = [
    "dbt-snowflake>=1.10",
    "dlt[snowflake]>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "sqlfluff>=3.3",
    "sqlfluff-templater-dbt>=3.3",
    "pre-commit>=4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # ruff format handles code line length; long docstring lines are fine

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.dagster]
module_name = "orchestration.craftstones_dagster.definitions"
code_location_name = "craftstones_dagster"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "ingestion", "orchestration"]
