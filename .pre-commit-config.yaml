# Hook revs checked against upstream tags on 2026-10-14. Keep ruff's rev in sync with pyproject.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint (dbt models)
        entry: uv run sqlfluff lint
        language: system
        files: ^transform/(models|tests|snapshots)/.*\.sql$
        require_serial: true  # the dbt templater compiles the whole project; one process is enough
